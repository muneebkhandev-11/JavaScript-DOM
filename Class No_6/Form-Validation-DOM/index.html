<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script async src="script.js"></script>
  </head>
  <body>
    <form action="" id="studentForm">
      <label for="">Username:</label>
      <input type="text" name="" id="username" />

      <br />
      <br />

      <label for="">Gender</label>
      <input type="radio" name="gender" id="male" value="male" /> Male
      <input type="radio" name="gender" id="female" value="female" />Female

      <br />

      <input type="checkbox" name="languages" id="" value="English" />English
      <input type="checkbox" name="languages" id="" value="Urdu" />Urdu
      <input type="checkbox" name="languages" id="" value="arbic" />arbic
      <input type="checkbox" name="languages" id="" value="Hindi" />Hindi
      <input type="checkbox" name="languages" id="" value="Pustho" />Pushto
      <br />
      <select name="country" id="country">
        <option value="United States">United States</option>
        <option value="Pakistan">Pakistan</option>
        <option value="Saudi Arabia">Saudi Arabia</option>
        <option value="India">India</option>
        <option value="Afghanistan">Afghanistan</option>
      </select>

      <button id="btn">Show Result</button>
    </form>
  </body>
</html>
